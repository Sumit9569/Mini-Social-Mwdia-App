{% extends 'base.html' %}
{% block content %}

<div class="form-box">
    <h2>Enter OTP</h2>

    {% if error %}
        <p class="error">{{ error }}</p>
    {% endif %}

    <form method="POST">
        {% csrf_token %}

        <label>OTP</label>
        <input type="text" name="otp" placeholder="Enter OTP" required>

        <button type="submit">Verify OTP</button>
    </form>
</div>

{% endblock %}
