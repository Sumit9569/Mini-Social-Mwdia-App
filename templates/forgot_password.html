{% extends 'base.html' %}
{% block content %}

<div class="form-box">
    <h2>Forgot Password</h2>

    {% if error %}
        <p class="error">{{ error }}</p>
    {% endif %}

    <form method="POST">
        {% csrf_token %}

        <label>Email</label>
        <input type="email" name="email" placeholder="Enter registered email" required>

        <button type="submit">Send Reset OTP</button>
    </form>

    <p>
        <a href="{% url 'login' %}">Back to Login</a>
    </p>
</div>

{% endblock %}
