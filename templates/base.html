<!DOCTYPE html>
<html>
<head>
    <title>SocialApp</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>

<nav class="navbar">
    <div class="nav-brand">
        <h2><i class="fa-solid fa-users"></i> SocialApp</h2>

        <button type="button" class="menu-btn" onclick="toggleMenu()">
            <i class="fa-solid fa-bars"></i>
        </button>
    </div>

    <div class="nav-links" id="navLinks">
        {% if user.is_authenticated %}
            <a href="{% url 'home' %}"><i class="fa-solid fa-house"></i> Home</a>
            <a href="{% url 'create_post' %}"><i class="fa-solid fa-plus"></i> Create</a>
            <a href="{% url 'profile' user.username %}"><i class="fa-solid fa-user"></i> Profile</a>
            <a href="{% url 'logout' %}"><i class="fa-solid fa-right-from-bracket"></i> Logout</a>
        {% else %}
            <a href="{% url 'login' %}">Login</a>
            <a href="{% url 'register' %}">Register</a>
        {% endif %}

        <button type="button" class="dark-toggle" onclick="toggleDarkMode()" id="darkBtn">
            🌙 Dark
        </button>
    </div>
</nav>

<div class="container">
    {% block content %}
    {% endblock %}
</div>

<script>
function toggleMenu() {
    const nav = document.getElementById("navLinks");
    nav.classList.toggle("active");
}

function toggleDarkMode() {
    document.body.classList.toggle("dark-mode");

    if (document.body.classList.contains("dark-mode")) {
        localStorage.setItem("theme", "dark");
        document.getElementById("darkBtn").innerHTML = "☀️ Light";
    } else {
        localStorage.setItem("theme", "light");
        document.getElementById("darkBtn").innerHTML = "🌙 Dark";
    }
}

document.addEventListener("DOMContentLoaded", function () {
    const savedTheme = localStorage.getItem("theme");

    if (savedTheme === "dark") {
        document.body.classList.add("dark-mode");
        document.getElementById("darkBtn").innerHTML = "☀️ Light";
    }
});
</script>

</body>
</html>
